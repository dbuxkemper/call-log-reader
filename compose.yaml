services:
  call-log-reader:
    build: .
    container_name: call-log-reader
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "${HOST_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

